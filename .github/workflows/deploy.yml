# ──────────────────────────────────────────────────────────────────────────────
# GitHub Actions: build → deploy to GitHub Pages
#
# Setup (one time):
#   1. Push this repo to GitHub as  officialmikan/chess-coach
#   2. Repo Settings → Pages → Source: "GitHub Actions"
#   3. That's it — every push to main auto-deploys
# ──────────────────────────────────────────────────────────────────────────────
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: read
  pages:    write
  id-token: write

# Only one deploy at a time
concurrency:
  group:            pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # GITHUB_PAGES=true tells vite.config.js to set base='/chess-coach/'
        env:
          GITHUB_PAGES: true
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
