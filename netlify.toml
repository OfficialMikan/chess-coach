[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

# Rewrite /api/gemini/* → Netlify function
[[redirects]]
  from   = "/api/gemini/*"
  to     = "/.netlify/functions/gemini/:splat"
  status = 200

# SPA fallback — all other routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
